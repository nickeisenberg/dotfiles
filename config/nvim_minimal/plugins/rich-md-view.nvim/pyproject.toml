[project]
name = "rich-md-view"
version = "0.1.0"
description = "Live markdown preview for Neovim, rendered with rich"
requires-python = ">=3.10"
dependencies = [
  # richmdviewnvim.markdown relies on rich.markdown internals; tested 14, 15.
  "rich>=14,<16",
  "markdown-it-py>=4",
  "mdit-py-plugins>=0.5",
  # 3.x is a rewrite with a different latex2text API.
  "pylatexenc>=2.10,<3",
  "pillow>=10",
]

# src layout, with python/ as the source directory. Neovim runs the package
# from there itself, so installing is only needed for the dependencies (or
# to use the package outside Neovim).
[tool.setuptools.packages.find]
where = ["python"]

# Lets editors resolve `richmdviewnvim` imports without installing it.
[tool.pyright]
extraPaths = ["python"]

[tool.ruff]
src = ["python"]
line-length = 79

[tool.ruff.lint]
fixable = ["ALL"]
ignore = ["E501"]
unfixable = ["F401"]
select = ["E", "F", "I", "UP", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
# always the full import path, never `from .x import y`
ban-relative-imports = "all"

[tool.ruff.format]
skip-magic-trailing-comma = true
