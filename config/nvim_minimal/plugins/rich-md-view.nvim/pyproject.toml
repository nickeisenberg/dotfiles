[project]
name = "rich-md-view"
version = "0.1.0"
description = "Live markdown preview for Neovim, rendered with rich"
requires-python = ">=3.10"
dependencies = [
  # mdview_markdown.MdViewMarkdown relies on rich.markdown internals; tested 14, 15.
  "rich>=14,<16",
  "markdown-it-py>=4",
  "mdit-py-plugins>=0.5",
  # 3.x is a rewrite with a different latex2text API.
  "pylatexenc>=2.10,<3",
  "pillow>=10",
]

# Only installs the dependencies: Neovim runs python/mdview.py by path, so
# there is nothing to package (and lua/, demo/ would confuse discovery).
[tool.setuptools]
packages = []

[tool.ruff]
line-length = 79

[tool.ruff.lint]
fixable = ["ALL"]
ignore = ["E501"]
unfixable = ["F401"]
select = ["E", "F", "I", "UP", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
# always the full import path, never `from .x import y`
ban-relative-imports = "all"

[tool.ruff.format]
skip-magic-trailing-comma = true
